name: Feature request
description: Propose a supported Android or project-documentation improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and user need
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Android app
        - RTMP transport
        - WHIP transport
        - HTTP transport
        - Documentation or policy
        - Unsupported iOS Experimental reference
    validations:
      required: true
  - type: textarea
    id: provenance
    attributes:
      label: External code, assets, SDKs, or references
      description: List every source and applicable license/terms, or state that none are proposed.
    validations:
      required: true
